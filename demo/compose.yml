name: bts-contract-demo
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run prepare.ps1 first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U odoo -d postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail-data:/data
    restart: unless-stopped
  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - web-data:/var/lib/odoo
      - ../addons:/mnt/extra-addons:ro
      - ./.local/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./:/mnt/demo:ro
    restart: unless-stopped
  proxy:
    image: nginx:1.28-alpine
    depends_on:
      - odoo
      - mailpit
    ports:
      - '127.0.0.1:8079:8069'
      - '127.0.0.1:8025:8025'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - frontend
    restart: unless-stopped
networks:
  default:
    internal: true
  frontend:
volumes:
  db-data:
  web-data:
  mail-data:
